name: deeptutor_mobile
description: DeepTutor mobile companion app for AI-powered quiz and voice answering.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^9.2.2
  record: ^6.2.1
  permission_handler: ^11.3.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_markdown: ^0.7.4+3
  path_provider: ^2.1.4
  wakelock_plus: ^1.5.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
